apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
spec:
  interval: 30m
  chart:
    spec:
      chart: ./deploy/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: frontend
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    host: app.${NODE_DOMAIN}
    nodePath: ${NODE_PATH}
    image:
      digest: "" # per node
