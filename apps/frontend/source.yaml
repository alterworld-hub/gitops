# Chart comes from the service repo at a release tag (version set per node).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: frontend
spec:
  interval: 10m
  url: https://github.com/alterworld-hub/frontend
  ref:
    tag: v0.0.0 # per node
  ignore: |
    /*
    !/deploy/chart/
