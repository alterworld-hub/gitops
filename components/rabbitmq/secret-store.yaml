# Copies a service's RabbitMQ credentials from namespace rabbitmq into the service namespace
# (the operator needs user credentials next to the cluster; services mount them in their own namespace).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: rabbitmq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rabbitmq-secret-reader-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:basic-user # SelfSubjectRulesReview, used by ESO to validate the store
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: rabbitmq
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: rabbitmq
spec:
  provider:
    kubernetes:
      remoteNamespace: rabbitmq
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: rabbitmq
      auth:
        serviceAccount:
          name: secret-reader
          namespace: rabbitmq
