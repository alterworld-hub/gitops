apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${NODE_DOMAIN}`)
        entryPoints: [web]
