# Node features, Cargo-style. A node lists features in nodes/<node>/node.yaml; `just features` renders
# its layer kustomizations. Code is the same on every node: features only pick which components run.
apiVersion: alterworld-hub.github.io/v1alpha1
kind: FeatureCatalog

# On every node, never toggled: CRD providers and operators. Turning a feature off deletes its objects
# while their operator still runs and finalizes them (Flux has no deletion order between layers).
platform:
  infrastructure: [traefik, cert-manager, external-secrets, cloudnative-pg]
  operators: [rabbitmq-operators]

# Toggled by features: component (components/<name>) -> layer (data or apps).
components:
  postgres: data
  rabbitmq: data
  frontend: apps

# Data lost when the component leaves a node (with every service database for postgres).
# CI fails a PR that drops any of it unless the PR has label drop-data.
stateful: [postgres, rabbitmq]

# Services and what they need on the node. Each need is also a feature of the same name, so enabling
# a service enables it. Per need the node gets (bootstrap/*.tpl): postgres -> role + database + Secret
# `postgres` in namespace <service>; rabbitmq -> user + permissions + Secret `rabbitmq` there.
services:
  playground: {needs: [postgres, rabbitmq]} # sandbox for trying a service against the node

# A feature enables components (dep:<component>), services (svc:<service>) and other features.
features:
  postgres: [dep:postgres]
  rabbitmq: [dep:rabbitmq]
  web: [dep:frontend]
  playground: [svc:playground]
  # Codenames: sets of features.
  lados: [postgres, rabbitmq, web]
