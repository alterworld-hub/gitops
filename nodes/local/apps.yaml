apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./nodes/local/apps
  prune: true
  # No wait/dependsOn: HelmRelease handles its own readiness and remediation; blocking here
  # delayed every rollout by minutes (platform re-health-check + 30s dependency requeue).
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      NODE_DOMAIN: local.alterworld-hub.localhost
      NODE_PATH: local
