apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./nodes/local/apps
  prune: true
  # Layer 2. No wait: HelmRelease handles its own readiness and remediation.
  # Add `dependsOn: [{name: infrastructure}]` only when an app uses CRDs from layer 1
  # (dependency requeue adds ~30s+ to every rollout). Current apps use only core kinds.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      NODE_DOMAIN: local.alterworld-hub.localhost
      NODE_PATH: local
