apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
# Layer 1.5: data services (Postgres cluster, per-service databases). Needs operator CRDs from layer 1.
metadata:
  name: data
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./nodes/local/data
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
