apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
# Layer 2a: data services (Postgres, RabbitMQ) and per-service databases/users. Needs operators from layers 1 and 1b.
metadata:
  name: data
  namespace: flux-system
spec:
  dependsOn:
    - name: operators
  interval: 10m
  path: ./nodes/local/data
  prune: true
  wait: true
  timeout: 10m
  # kstatus treats a fresh CNPG object as current; judge readiness by its own status instead.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied
      failed: has(status.applied) && !status.applied
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied
      failed: has(status.applied) && !status.applied
    - apiVersion: rabbitmq.com/v1beta1
      kind: RabbitmqCluster
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'ClusterAvailable' && c.status == 'True') && status.conditions.exists(c, c.type == 'AllReplicasReady' && c.status == 'True')
    - apiVersion: rabbitmq.com/v1beta1
      kind: Vhost
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: rabbitmq.com/v1beta1
      kind: User
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - apiVersion: rabbitmq.com/v1beta1
      kind: Permission
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      NODE_DOMAIN: local.alterworld-hub.localhost
