# Generated by `just features` from node.yaml and features.yaml. Do not edit.
# Database for service `playground`: role and database `playground` in cluster main;
# credentials as Secret `postgres` in namespace `playground` (keys: host, port, dbname, username, password, uri).
# Dropped with the service (reclaim policies below); CI requires label drop-data for that.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playground-password
  namespace: postgres
spec:
  refreshPolicy: CreatedOnce # generated once; Periodic would rotate it under running services
  target:
    name: playground-password
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: playground
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: db-password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: playground
  namespace: postgres
spec:
  cluster:
    name: main
  name: playground
  login: true
  passwordSecret:
    name: playground-password
  databaseRoleReclaimPolicy: delete
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: playground
  namespace: postgres
spec:
  cluster:
    name: main
  name: playground
  owner: playground
  databaseReclaimPolicy: delete
---
# Lands in namespace playground whenever it exists; no ordering with the service deploy.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: playground-postgres
spec:
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: playground
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: postgres
    target:
      name: postgres
      template:
        data:
          host: main-rw.postgres.svc
          port: "5432"
          dbname: playground
          username: "{{ .username }}"
          password: "{{ .password }}"
          uri: "postgresql://{{ .username }}:{{ .password }}@main-rw.postgres.svc:5432/playground"
    dataFrom:
      - extract:
          key: playground-password
---
# RabbitMQ user for service `playground` (generated username) in vhost alterworld: configure/write `playground.*`, read own + `*.events`;
# credentials as Secret `rabbitmq` in namespace `playground` (keys: host, port, vhost, username, password, uri).
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: playground
  namespace: rabbitmq
# The operator generates username and password into Secret playground-user-credentials.
# (importCredentialsSecret would need the Secret before the webhook admits the User.)
spec:
  rabbitmqClusterReference:
    name: main
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: playground
  namespace: rabbitmq
spec:
  vhost: alterworld
  userReference:
    name: playground
  permissions:
    configure: '^playground\.'
    write: '^playground\.'
    read: '^(playground\..*|.*\.events)$'
  rabbitmqClusterReference:
    name: main
---
# Lands in namespace playground whenever it exists; no ordering with the service deploy.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: playground-rabbitmq
spec:
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: playground
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: rabbitmq
    target:
      name: rabbitmq
      template:
        data:
          host: main.rabbitmq.svc
          port: "5672"
          vhost: alterworld
          username: "{{ .username }}"
          password: "{{ .password }}"
          uri: "amqp://{{ .username }}:{{ .password }}@main.rabbitmq.svc:5672/alterworld"
    dataFrom:
      - extract:
          key: playground-user-credentials
