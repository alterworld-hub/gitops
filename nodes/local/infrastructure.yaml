apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
# Layer 1: CRD and controller providers (ingress, operators). Applied before anything that uses their CRDs.
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./nodes/local/infrastructure
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      NODE_DOMAIN: local.alterworld-hub.localhost
