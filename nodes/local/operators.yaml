apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
# Layer 1b: operators shipped as plain manifests that need layer-1 CRDs (cert-manager certificates for webhooks).
metadata:
  name: operators
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./nodes/local/operators
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
