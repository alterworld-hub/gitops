apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  path: ./nodes/local/platform
  prune: true
  # Temporary: keep managed objects when this Kustomization is renamed to `infrastructure`.
  deletionPolicy: Orphan
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      NODE_DOMAIN: local.alterworld-hub.localhost
